---
# tasks file for webserver
- name: Installer le paquet {{ webserver_package }}
  ansible.builtin.apt:
    name: "{{ webserver_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Déployer la configuration du site
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ webserver_server_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Recharger nginx

- name: Désactiver le site par défaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Recharger nginx

- name: Activer le site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ webserver_server_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ webserver_server_name }}.conf"
    state: link
  notify: Recharger nginx

- name: S'assurer que la racine du site existe
  ansible.builtin.file:
    path: "{{ webserver_document_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Déployer une page d'accueil
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ webserver_document_root }}/index.html"
    owner: root
    group: root
    mode: "0644"

- name: Vérifier la présence d'UFW
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: webserver_ufw_bin

- name: Autoriser le port HTTP dans UFW
  community.general.ufw:
    rule: allow
    port: "{{ webserver_port | string }}"
    proto: tcp
  when: webserver_manage_firewall and webserver_ufw_bin.stat.exists

- name: S'assurer que le service est démarré et activé au boot
  ansible.builtin.service:
    name: "{{ webserver_service }}"
    state: started
    enabled: true
