[local]
localhost ansible_connection=local

[webservers]
10.20.1.10
SRV-EVE-NG ansible_host=10.20.1.12

[webservers:vars]
ansible_user=root
# Le mot de passe SSH est chiffré via ansible-vault, voir
# inventory/group_vars/webservers/vault.yml (variable ansible_password)

# vCenter Server : géré via l'API (module community.vmware), pas en SSH.
[vcenter]
10.20.1.30 ansible_connection=local ansible_python_interpreter=/root/.local/pipx/venvs/ansible/bin/python
# Identifiants chiffrés via ansible-vault, voir
# inventory/group_vars/vcenter/vault.yml (vcenter_username / vcenter_password)

# VMs découvertes sur l'hyperviseur ESXi 10.20.1.10 (esxcli vm process list / vim-cmd vmsvc.get.guest)
# SRV-EVE-NG (10.20.1.12) est déjà déclarée ci-dessus dans [webservers], ne pas la redéclarer ici.
[ad]
DC01-AD ansible_host=10.20.1.250
DC02-AD-REPLI ansible_host=10.20.1.19

[ad:vars]
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_port=5985
ansible_winrm_scheme=http

# ESXi imbriqués (nested) : accès non confirmé, à ajuster selon le mode de gestion réel.
[esxi_nested]
ESXI01 ansible_host=10.20.1.20
ESXI02 ansible_host=10.20.1.21

[linux_vms]
NOC ansible_host=10.20.1.11
Routeur-Tailscale ansible_host=10.20.1.22

[linux_vms:vars]
ansible_user=root
